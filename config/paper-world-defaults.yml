# ═══════════════════════════════════════════════════════════════
#  paper-world-defaults.yml — per-world tuning
#
#  The two settings that matter most for a 100-player server are
#  entity activation ranges and mob spawn limits. Everything else
#  is secondary.
# ═══════════════════════════════════════════════════════════════

_version: 31

chunks:
  auto-save-interval: 6000
  delay-chunk-unloads-by: 10s
  entity-per-chunk-save-limit:
    # Caps per-chunk entity persistence. A projectile farm or an
    # item-dupe accident otherwise writes a chunk that then lags on
    # every subsequent load.
    arrow: 16
    ender_pearl: 8
    experience_orb: 24
    eye_of_ender: 8
    fireball: 8
    snowball: 8
  fixed-chunk-inhabited-time: -1
  flush-regions-on-save: false
  max-auto-save-chunks-per-tick: 16
  prevent-moving-into-unloaded-chunks: true

collisions:
  allow-player-cramming-damage: true
  allow-vehicle-collisions: true
  fix-climbing-bypassing-cramming-rule: true
  # 8 is generous; the vanilla 24 lets mob stacking crush tick time.
  max-entity-collisions: 2
  only-players-collide: false

entities:
  armor-stands:
    do-collision-entity-lookups: false
    tick: false
  markers:
    tick: false
  spawning:
    # Activation range is the single highest-value entity setting:
    # entities beyond it skip AI entirely.
    alt-item-despawn-rate:
      enabled: true
      items:
        cobblestone: 300
        dirt: 300
        gravel: 300
        netherrack: 300
        sand: 300
    count-all-mobs-for-spawning: false
    despawn-ranges:
      ambient:
        hard: 96
        soft: 32
      axolotls:
        hard: 96
        soft: 32
      creature:
        hard: 96
        soft: 32
      misc:
        hard: 96
        soft: 32
      monster:
        hard: 96
        soft: 32
      underground_water_creature:
        hard: 96
        soft: 32
      water_ambient:
        hard: 64
        soft: 32
      water_creature:
        hard: 96
        soft: 32
    disable-mob-spawner-spawn-egg-transformation: false
    duplicate-uuid:
      mode: SAFE_REGEN
      safe-regen-delete-range: 32
    filter-bad-tile-entity-nbt-from-falling-blocks: true
    filter-nbt-data-from-spawn-egg-and-related: true
    iron-golems-can-spawn-in-air: false
    monster-spawn-max-light-level: -1
    non-player-arrow-despawn-rate: 60
    creative-arrow-despawn-rate: 60
    per-player-mob-spawns: true
    scan-for-legacy-ender-dragon: true
    skeleton-horse-thunder-spawn-chance: 0.01
    slime-spawn-height:
      slime-chunk:
        maximum: 40.0
      surface-biome:
        maximum: 70.0
        minimum: 50.0
    spawn-limits:
      # Per-player limits (per-player-mob-spawns: true above), so these
      # are not global caps. Lowering monster from 70 to 50 cuts total
      # hostile load roughly 30% with little gameplay impact.
      ambient: 1
      axolotls: 2
      creature: 8
      monster: 50
      underground_water_creature: 2
      water_ambient: 6
      water_creature: 3
    ticks-per-spawn:
      ambient: -1
      axolotls: -1
      creature: -1
      monster: -1
      underground_water_creature: -1
      water_ambient: -1
      water_creature: -1
    wandering-trader:
      spawn-chance-failure-increment: 25
      spawn-chance-max: 150
      spawn-chance-min: 25
      spawn-day-length: 24000
      spawn-minute-length: 1200

environment:
  disable-explosion-knockback: false
  disable-ice-and-snow: false
  disable-teleportation-suffocation-check: false
  disable-thunder: false
  fire-tick-delay: 30
  frosted-ice:
    delay:
      max: 40
      min: 20
    enabled: true
  generate-flat-bedrock: false
  nether-ceiling-void-damage-height: 0
  optimize-explosions: true
  portal-create-radius: 16
  portal-search-vanilla-dimension-scaling: true
  treasure-maps:
    enabled: true
    find-already-discovered:
      loot-tables: default
      villager-trade: false
  water-over-lava-flow-speed: 5

feature-seeds:
  generate-random-seeds-for-all: false

fishing-time-range:
  maximum: 600
  minimum: 100

hopper:
  # Hoppers are a classic TPS sink in large redstone builds.
  # disable-move-event skips the event dispatch entirely when no
  # plugin listens for it.
  cooldown-when-full: true
  disable-move-event: true
  ignore-occluding-blocks: true

lootables:
  auto-replenish: false
  max-refills: -1
  refresh-max: 2d
  refresh-min: 12h
  reset-seed-on-fill: true
  restrict-player-reloot: true

maps:
  item-frame-cursor-limit: 128

misc:
  disable-end-credits: false
  disable-relative-projectile-velocity: false
  disable-sprint-interruption-on-attack: false
  light-queue-size: 20
  max-leash-distance: 10.0
  redstone-implementation: ALTERNATE_CURRENT
  shield-blocking-delay: 5
  show-sign-click-command-failure-msgs-to-player: false
  update-pathfinding-on-block-update: false

scoreboards:
  allow-non-player-entities-on-scoreboards: false
  use-vanilla-world-scoreboard-name-coloring: false

spawn:
  allow-using-signs-inside-spawn-protection: false
  keep-spawn-loaded: false
  keep-spawn-loaded-range: 2

tick-rates:
  behavior:
    villager:
      validatenearbypoi: -1
      acquirepoi: 120
  container-update: 1
  grass-spread: 4
  # Mob AI sensors are polled far more often than gameplay requires.
  # Villagers in particular run expensive POI searches.
  mob-spawner: 2
  sensor:
    villager:
      secondarypoisensor: 80
      nearestbedsensor: 80
      villagerbabiessensor: 40
      playersensor: 40
