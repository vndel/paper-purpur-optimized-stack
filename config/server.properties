# ═══════════════════════════════════════════════════════════════
#  server.properties — Paper/Purpur, 100+ player profile
#
#  The two lines that matter most here are view-distance and
#  simulation-distance. They are separate for a reason: players
#  want to SEE far, but entities only need to be SIMULATED close.
#  Dropping simulation-distance from 10 to 6 is typically the single
#  largest TPS win available on a populated server, and players
#  rarely notice it.
# ═══════════════════════════════════════════════════════════════

accepts-transfers=false
allow-flight=true
allow-nether=true
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
difficulty=hard
enable-command-block=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=true
enable-status=true
enforce-secure-profile=true
enforce-whitelist=false
entity-broadcast-range-percentage=60
force-gamemode=false
function-permission-level=2
gamemode=survival
generate-structures=true
generator-settings={}
hardcore=false
hide-online-players=false
initial-disabled-packs=
initial-enabled-packs=vanilla
level-name=world
level-seed=
level-type=minecraft\:normal
log-ips=true
max-chained-neighbor-updates=1000000
max-players=150
max-tick-time=60000
max-world-size=29999984
motd=\u00a7bCodeHub Network \u00a78| \u00a7fSurvival
network-compression-threshold=256
online-mode=false
op-permission-level=4
player-idle-timeout=0
prevent-proxy-connections=false
pvp=true
query.port=25565
rate-limit=0
rcon.password=REPLACE_WITH_STRONG_RCON_PASSWORD
rcon.port=25575
region-file-compression=deflate
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
server-ip=127.0.0.1
server-port=25565
simulation-distance=6
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
spawn-protection=0
sync-chunk-writes=false
text-filtering-config=
use-native-transport=true
view-distance=8
white-list=false
