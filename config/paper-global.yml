# ═══════════════════════════════════════════════════════════════
#  paper-global.yml — server-wide Paper settings
#  Target: 100+ concurrent players at a sustained 20 TPS
#
#  Only keys that differ from Paper defaults are listed, each with
#  the reason. A config that restates defaults hides the decisions.
# ═══════════════════════════════════════════════════════════════

_version: 29

chunk-loading:
  # Caps how much chunk work a single player can demand per tick.
  # Without this, one player flying an elytra at speed can starve
  # everyone else's chunk pipeline.
  autoconfig-send-distance: true
  enable-frustum-priority: false
  global-max-chunk-load-rate: 300.0
  global-max-chunk-send-rate: 150.0
  global-max-concurrent-loads: 500.0
  max-concurrent-sends: 2
  min-load-radius: 2
  player-max-chunk-load-rate: 100.0
  player-max-concurrent-loads: 20.0
  target-player-chunk-send-rate: 100.0

chunk-system:
  gen-parallelism: default
  # 4 I/O threads is the sweet spot on NVMe; more threads mostly add
  # contention on the region file locks rather than throughput.
  io-threads: 4
  worker-threads: 6

collisions:
  enable-player-collisions: false
  send-full-pos-for-hard-colliding-entities: true

commands:
  fix-target-selector-tag-completion: true
  suggest-player-names-when-null-tab-completions: true
  time-command-affects-all-worlds: false

item-validation:
  display-name: 8192
  loc-name: 8192
  resolve-selectors-in-books: false
  book:
    author: 8192
    page: 16384
    title: 8192

logging:
  deobfuscate-stacktraces: true

messages:
  kick:
    authentication-servers-down: '<lang:multiplayer.disconnect.authservers_down>'
    connection-throttle: 'Connection throttled, try again in a moment.'
    flying-player: '<lang:multiplayer.disconnect.flying>'
    flying-vehicle: '<lang:multiplayer.disconnect.flying>'
  no-permission: '<red>You do not have permission for that.</red>'
  use-display-name-in-quit-message: false

misc:
  chat-threads:
    chat-executor-core-size: -1
    chat-executor-max-size: -1
  compression-level: default
  # Hard cap on explosion block processing. A single TNT cannon in a
  # dense build can otherwise stall a tick outright.
  max-joins-per-tick: 5
  fix-entity-position-desync: true
  load-permissions-yml-before-plugins: true
  region-file-cache-size: 256
  strict-advancement-dimension-check: false
  use-alternative-luck-formula: false
  use-dimension-type-for-custom-spawners: false

packet-limiter:
  all-packets:
    action: KICK
    interval: 7.0
    max-packet-rate: 500.0
  kick-message: '<red>Packet limit exceeded.</red>'
  overrides:
    ServerboundPlaceRecipePacket:
      action: DROP
      interval: 4.0
      max-packet-rate: 5.0

player-auto-save:
  max-per-tick: -1
  rate: -1

proxies:
  bungee-cord:
    online-mode: true
  # Modern forwarding is the only safe option behind Velocity; it
  # cryptographically signs the forwarded identity, so a leaked
  # backend port cannot be used to impersonate players.
  velocity:
    enabled: true
    online-mode: true
    secret: 'REPLACE_WITH_VELOCITY_FORWARDING_SECRET'
  proxy-protocol: false

scoreboards:
  save-empty-scoreboard-teams: false
  track-plugin-scoreboards: false

spam-limiter:
  incoming-packet-threshold: 300
  recipe-spam-increment: 1
  recipe-spam-limit: 20
  tab-spam-increment: 1
  tab-spam-limit: 500

timings:
  enabled: false
  url: https://timings.aikar.co/

unsupported-settings:
  allow-headless-pistons: false
  allow-permanent-block-break-exploits: false
  allow-piston-duplication: false
  compression-format: ZLIB

watchdog:
  early-warning-delay: 10000
  early-warning-every: 5000
