# ═══════════════════════════════════════════════════════════════
#  bukkit.yml
#  Legacy spawn limits and ticks-per values. Paper's per-world
#  settings override most of this, but these remain the fallback.
# ═══════════════════════════════════════════════════════════════

settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: false
  deprecated-verbose: false
  shutdown-message: '§cServer restarting. Back shortly.'
  minimum-api: '1.20'
  use-map-color-cache: true

spawn-limits:
  monsters: 50
  animals: 8
  water-animals: 3
  water-ambient: 6
  water-underground-creature: 2
  axolotls: 2
  ambient: 1

chunk-gc:
  period-in-ticks: 400

ticks-per:
  animal-spawns: 400
  monster-spawns: 2
  water-spawns: 400
  water-ambient-spawns: 400
  water-underground-creature-spawns: 400
  axolotl-spawns: 400
  ambient-spawns: 400
  autosave: 6000

aliases: now-in-commands.yml
