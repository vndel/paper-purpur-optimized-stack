# ═══════════════════════════════════════════════════════════════
#  spigot.yml
#
#  entity-activation-range is the highest-leverage block in this
#  file. Entities outside the range skip AI ticks entirely, so
#  trimming it from the defaults (32/32/16) to 24/16/8 removes a
#  large amount of pathfinding work at no visible cost.
# ═══════════════════════════════════════════════════════════════

config-version: 12

settings:
  bungeecord: false
  save-user-cache-on-stop-only: true
  sample-count: 12
  player-shuffle: 0
  user-cache-size: 1000
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
  netty-threads: 4
  attribute:
    maxAbsorption:
      max: 2048.0
    maxHealth:
      max: 2048.0
    movementSpeed:
      max: 2048.0
    attackDamage:
      max: 2048.0

messages:
  whitelist: '§cYou are not whitelisted.'
  unknown-command: '§cUnknown command.'
  server-full: '§cThe server is full.'
  outdated-client: '§cOutdated client. Please use {0}.'
  outdated-server: '§cOutdated server. We are still on {0}.'
  restart: '§cServer restarting. Back shortly.'

advancements:
  disable-saving: false
  disabled:
    - minecraft:story/disabled

commands:
  log: true
  tab-complete: 0
  send-namespaced: false
  spam-exclusions:
    - /skill
  silent-commandblock-console: false
  replace-commands:
    - setblock
    - summon
    - testforblock
    - tellraw

world-settings:
  default:
    below-zero-generation-in-existing-chunks: true
    verbose: false

    entity-activation-range:
      animals: 16
      monsters: 24
      raiders: 48
      misc: 8
      water: 8
      villagers: 16
      flying-monsters: 48
      wake-up-inactive:
        animals-max-per-tick: 4
        animals-every: 1200
        animals-for: 100
        monsters-max-per-tick: 8
        monsters-every: 400
        monsters-for: 100
        villagers-max-per-tick: 4
        villagers-every: 600
        villagers-for: 100
        flying-monsters-max-per-tick: 8
        flying-monsters-every: 200
        flying-monsters-for: 100
      villagers-work-immunity-after: 100
      villagers-work-immunity-for: 20
      villagers-active-for-panic: true
      tick-inactive-villagers: false
      ignore-spectators: true

    entity-tracking-range:
      players: 48
      animals: 48
      monsters: 48
      misc: 32
      display: 128
      other: 64

    ticks-per:
      hopper-transfer: 8
      hopper-check: 8
    hopper-amount: 3
    hopper-can-load-chunks: false

    dragon-death-sound-radius: 0
    seed-village: 10387312
    seed-desert: 14357617
    seed-igloo: 14357618
    seed-jungle: 14357619
    seed-swamp: 14357620
    seed-monument: 10387313
    seed-shipwreck: 165745295
    seed-ocean: 14357621
    seed-outpost: 165745296
    seed-endcity: 10387313
    seed-slime: 987234911
    seed-nether: 30084232
    seed-mansion: 10387319
    seed-fossil: 14357921
    seed-portal: 34222645

    hunger:
      jump-walk-exhaustion: 0.05
      jump-sprint-exhaustion: 0.2
      combat-exhaustion: 0.1
      regen-exhaustion: 6.0
      swim-multiplier: 0.01
      sprint-multiplier: 0.1
      other-multiplier: 0.0

    max-tnt-per-tick: 100
    max-tick-time:
      tile: 50
      entity: 50

    merge-radius:
      exp: 4.0
      item: 3.5

    growth:
      cactus-modifier: 100
      cane-modifier: 100
      melon-modifier: 100
      mushroom-modifier: 100
      pumpkin-modifier: 100
      sapling-modifier: 100
      beetroot-modifier: 100
      carrot-modifier: 100
      potato-modifier: 100
      torchflower-modifier: 100
      wheat-modifier: 100
      netherwart-modifier: 100
      vine-modifier: 100
      cocoa-modifier: 100
      bamboo-modifier: 100
      sweetberry-modifier: 100
      kelp-modifier: 100
      twistingvines-modifier: 100
      weepingvines-modifier: 100
      cavevines-modifier: 100
      glowberry-modifier: 100
      pitcherplant-modifier: 100

    item-despawn-rate: 4000
    view-distance: default
    simulation-distance: default
    thunder-chance: 100000
    nerf-spawner-mobs: true
